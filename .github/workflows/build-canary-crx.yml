name: Build Canary Test CRX

run-name: Build Canary CRX from ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string
        default: ae34ef90b5369cdc84c6b52ec966b1be5b910ff9

permissions:
  contents: read

jobs:
  build:
    name: Build and package Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          printf 'Verified source commit: %s\n' "$actual"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project tests
        run: npm test

      - name: Build Chrome extension
        run: npx --no-install gulp build-chrome

      - name: Package and validate throwaway test CRX
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          key="$RUNNER_TEMP/canary-test-only.pem"
          trap 'rm -f "$key"' EXIT
          openssl genrsa -out "$key" 2048 >/dev/null 2>&1
          chmod 600 "$key"
          google-chrome --headless --disable-gpu --no-sandbox \
            --pack-extension="$GITHUB_WORKSPACE/build/chrome" \
            --pack-extension-key="$key"
          crx="$GITHUB_WORKSPACE/build/chrome.crx"
          test -s "$crx"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          name="multipass-webdav-sync-canary-${SOURCE_SHA}.crx"
          cp "$crx" "$GITHUB_WORKSPACE/artifacts/$name"
          python3 - "$GITHUB_WORKSPACE/artifacts/$name" "$SOURCE_SHA" <<'PY'
          import io
          import json
          import pathlib
          import struct
          import sys
          import zipfile

          path = pathlib.Path(sys.argv[1])
          source_sha = sys.argv[2]
          data = path.read_bytes()
          if data[:4] != b"Cr24":
              raise SystemExit("CRX magic header is invalid")
          version = struct.unpack_from("<I", data, 4)[0]
          if version != 3:
              raise SystemExit(f"Expected CRX3, got CRX version {version}")
          header_size = struct.unpack_from("<I", data, 8)[0]
          zip_offset = 12 + header_size
          if header_size <= 0 or zip_offset >= len(data):
              raise SystemExit("CRX3 header length is invalid")
          archive = zipfile.ZipFile(io.BytesIO(data[zip_offset:]))
          bad_member = archive.testzip()
          if bad_member:
              raise SystemExit(f"ZIP CRC validation failed for {bad_member}")
          if "manifest.json" not in archive.namelist():
              raise SystemExit("CRX payload has no manifest.json")
          manifest = json.loads(archive.read("manifest.json"))
          if manifest.get("version") != "1.1.3":
              raise SystemExit(f"Unexpected manifest version: {manifest.get('version')}")
          if "js/extension.js" not in archive.namelist():
              raise SystemExit("CRX payload is missing the Chrome extension bundle")
          print(f"Validated CRX3 package: {path.name} ({len(data)} bytes)")
          print(f"Embedded extension version: {manifest['version']}")
          print(f"Source commit: {source_sha}")
          pathlib.Path("artifacts/build-info.txt").write_text(
              f"source_commit={source_sha}\n"
              f"extension_version={manifest['version']}\n"
              f"crx_file={path.name}\n"
              f"crx3_validated=true\n",
              encoding="utf-8",
          )
          PY
          rm -f "$key"
          trap - EXIT

      - name: Upload test CRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-crx-${{ inputs.source_sha }}
          path: |
            artifacts/multipass-webdav-sync-canary-${{ inputs.source_sha }}.crx
            artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 7
