name: Build Stable-ID Chrome CRX
run-name: Build CRX for ${{ inputs.source_ref || github.ref_name }}
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      source_ref:
        description: Source branch or release tag to package.
        required: false
        type: string
        default: ''
    secrets:
      MULTIPASS_MAIN_CRX_SIGNING_KEY_20261028:
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Test, build and package stable-ID CRX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Record source commit and extension version
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Build Chrome extension
        run: npx --no-install gulp build-chrome
      - name: Package and validate stable-ID CRX3
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_EXTENSION_ID: hjkmgjalkohpaboeabhmjkidfbekmpda
          CRX_SIGNING_KEY: ${{ secrets.MULTIPASS_MAIN_CRX_SIGNING_KEY_20261028 }}
          EXTENSION_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          test -n "$CRX_SIGNING_KEY" || { echo 'Required Actions secret is missing.' >&2; exit 1; }
          key="$RUNNER_TEMP/multipass-main-crx-signing-key.pem"
          public_key="$RUNNER_TEMP/multipass-main-crx-public-key.der"
          trap 'rm -f "$key" "$public_key"' EXIT
          printf '%s\n' "$CRX_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout
          openssl pkey -in "$key" -pubout -outform DER -out "$public_key"
          google-chrome --headless --disable-gpu --no-sandbox \
            --pack-extension="$GITHUB_WORKSPACE/build/chrome" \
            --pack-extension-key="$key"
          crx="$GITHUB_WORKSPACE/artifacts/multipass-webdav-sync-v${EXTENSION_VERSION}.crx"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$GITHUB_WORKSPACE/build/chrome.crx" "$crx"
          test -s "$crx"
          python3 scripts/verify-crx3.py \
            "$crx" "$SOURCE_SHA" "$public_key" \
            "$GITHUB_WORKSPACE/artifacts/build-info.txt"
      - name: Upload signed CRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-id-crx-v${{ steps.source.outputs.version }}
          path: |
            artifacts/multipass-webdav-sync-v${{ steps.source.outputs.version }}.crx
            artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30
