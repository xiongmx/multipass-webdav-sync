name: Publish Microsoft Edge Add-on

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: edge-addons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Check tag and source version consistency
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { parseReleaseVersion } = require('./scripts/release-version.cjs');
          const tag = process.env.RELEASE_TAG;
          const version = parseReleaseVersion(tag || '');
          if (!version) throw new Error('Release tag must be a stable semantic version, optionally prefixed with v.');

          const packageVersion = require('./package.json').version;
          const lockVersion = require('./package-lock.json').packages?.['']?.version;
          const manifestVersion = require('./vendor/common/manifest.json').version;
          for (const [source, actual] of Object.entries({
            'package.json': packageVersion,
            'package-lock.json': lockVersion,
            'vendor/common/manifest.json': manifestVersion,
          })) {
            if (actual !== version) {
              throw new Error(`${source} version ${actual} does not match tag version ${version}.`);
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Validated release tag and source version ${version}.`);
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Run project tests
        run: npm test

      - name: Build release packages
        run: |
          npm run dist
          npm run dist:firefox-android

      - name: Verify release packages
        run: npm run test:packages

      - name: Upload package and submit to certification
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID || vars.EDGE_ADDONS_CLIENT_ID }}
        run: node scripts/publish-edge-addons.mjs
